<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfall Chat</title>
    <link rel="stylesheet" href="/assets/chat/style.css">
</head>
<body>
    <div class="starfall-bg" id="starfallBg"></div>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="server-icon">✦</div>
                <div class="server-name">Starfall</div>
            </div>
            <div class="sidebar-content">
                <div class="section-title">People</div>
                <div id="peopleList" class="people-list"></div>
                <div id="peopleEmpty" class="empty-sidebar hidden">When your friend signs up, they’ll appear here.</div>
            </div>
            <div class="user-profile">
                <div class="avatar" id="myAvatar">?</div>
                <div class="user-info">
                    <div class="username" id="myName">Loading…</div>
                    <div class="status" id="connectionStatus">Connecting</div>
                </div>
                <button class="logout-btn" id="logoutButton" title="Sign out">↪</button>
            </div>
        </aside>

        <main class="main-content">
            <section id="welcomeView" class="welcome-view">
                <div class="welcome-star">✦</div>
                <h1>Your conversations</h1>
                <p id="welcomeMessage">Choose someone from the left to start chatting.</p>
            </section>

            <section id="chatView" class="chat-view hidden">
                <header class="chat-header">
                    <div class="dm-avatar" id="chatAvatar">?</div>
                    <div>
                        <div class="chat-title" id="chatName"></div>
                        <div class="chat-subtitle">Direct message</div>
                    </div>
                </header>
                <div class="messages" id="messages"></div>
                <form class="message-input-container" id="messageForm">
                    <input id="fileInput" type="file" hidden>
                    <button type="button" class="attachment-btn" id="attachmentButton" title="Share a file">📎</button>
                    <input class="message-input" id="messageInput" maxlength="4000" autocomplete="off" placeholder="Write a message…">
                    <button type="submit" class="send-btn">➤</button>
                </form>
                <div class="upload-status hidden" id="uploadStatus"></div>
            </section>
        </main>
    </div>
    <script src="/assets/chat/script.js"></script>
</body>
</html>
